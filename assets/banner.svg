<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="slightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }

    /* Dynamic CSS Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(10px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes dataPulse {
      0%, 100% { opacity: 0.4; r: 3; }
      50% { opacity: 1; r: 5; }
    }

    .orb-1 {
      animation: pulseGlow 8s ease-in-out infinite, floatOrb 10s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseGlow 10s ease-in-out infinite alternate, floatOrb 12s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .chart-flow {
      stroke-dasharray: 8, 4;
      animation: flowLine 15s linear infinite;
    }
    .pulse-node-1 { animation: dataPulse 2.5s ease-in-out infinite; }
    .pulse-node-2 { animation: dataPulse 2.5s ease-in-out infinite 0.8s; }
    .pulse-node-3 { animation: dataPulse 2.5s ease-in-out infinite 1.6s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Radiant Orbs (Deep in background) -->
  <g>
    <circle class="orb-1" cx="180" cy="90" r="140" fill="#38bdf8" opacity="0.3" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="310" r="160" fill="#818cf8" opacity="0.25" filter="url(#glow)" />
    <circle cx="600" cy="210" r="180" fill="#c084fc" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- Geometric Grid Pattern Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Subtle Dynamic Background Architecture Graph (Behind foreground content) -->
  <g opacity="0.45">
    <path class="chart-flow" d="M 80 340 Q 300 280, 500 330 T 900 270 T 1120 300" fill="none" stroke="url(#accentGrad)" stroke-width="2" />
    <circle class="pulse-node-1" cx="300" cy="285" r="4" fill="#34d399" />
    <circle class="pulse-node-2" cx="700" cy="300" r="4" fill="#38bdf8" />
    <circle class="pulse-node-3" cx="900" cy="270" r="4" fill="#c084fc" />
  </g>

  <!-- Foreground Main Card Container (Glassmorphism effect) -->
  <rect x="70" y="55" width="1060" height="310" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Accent Top Border Line -->
  <rect x="70" y="55" width="1060" height="3" rx="1.5" fill="url(#primaryGrad)" />

  <!-- Category Tagline Badge -->
  <g transform="translate(110, 88)">
    <rect width="320" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" />
    <text x="26" y="17" class="tagline-text">Commercial Terms &amp; Contract FinOps</text>
  </g>

  <!-- Main Hero Title (Guaranteed in foreground) -->
  <g transform="translate(110, 160)">
    <text class="title-text" fill="url(#primaryGrad)">Commercial Terms &amp; Contract Tracking</text>
  </g>

  <!-- Subtitle Paragraph -->
  <g transform="translate(110, 202)">
    <text class="subtitle-text">Curated ecosystem of SaaS &amp; Open-Source platforms preventing contract revenue leakage,</text>
    <text y="24" class="subtitle-text">enforcing CPQ &amp; rebate pricing rules, and synchronizing financial obligations to billing &amp; ERP.</text>
  </g>

  <!-- Interactive/Dynamic Feature Pills (Foreground Footer) -->
  <g transform="translate(110, 280)">
    <!-- Pill 1: Revenue Leakage -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <circle cx="16" cy="17" r="4.5" fill="#10b981" />
      <text x="28" y="21" class="pill-text">🛡️ Leakage Prevention</text>
    </g>

    <!-- Pill 2: CPQ & Pricing -->
    <g transform="translate(195, 0)">
      <rect width="170" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="16" cy="17" r="4.5" fill="#38bdf8" />
      <text x="28" y="21" class="pill-text">⚡ CPQ Enforcement</text>
    </g>

    <!-- Pill 3: ASC 606 / Compliance -->
    <g transform="translate(380, 0)">
      <rect width="180" height="34" rx="17" fill="rgba(192, 132, 252, 0.15)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
      <circle cx="16" cy="17" r="4.5" fill="#c084fc" />
      <text x="28" y="21" class="pill-text">📊 ASC 606 &amp; FinOps</text>
    </g>

    <!-- Pill 4: Open-Source Stacks -->
    <g transform="translate(575, 0)">
      <rect width="185" height="34" rx="17" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
      <circle cx="16" cy="17" r="4.5" fill="#f43f5e" />
      <text x="28" y="21" class="pill-text">💻 Self-Hosted / FOSS</text>
    </g>
  </g>
</svg>
